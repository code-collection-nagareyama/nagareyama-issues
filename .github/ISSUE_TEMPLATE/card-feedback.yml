name: カードへの気づき
description: 課題カードを読んで気づいたこと、誤り、足りない視点を共有します
title: "[カード] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        カードを読んで気になった点を書いてください。
        サイトの各カードページから開くと、対象カードがすでに入っています。
  - type: input
    id: card
    attributes:
      label: 対象のカード
      description: カード番号とタイトル（例: N-01 免許を返した日から、通院が遠くなる）
      placeholder: "N-01 …"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 気づきの種類
      options:
        - 事実・データの誤り
        - 表現・書きぶりの改善
        - 足りない視点・論点
        - 活用のアイデア
        - その他
    validations:
      required: true
  - type: dropdown
    id: block
    attributes:
      label: 主にどのブロックか
      options:
        - カード全体
        - 1. だれの、どの場面か
        - 2. 困っている場面
        - 3. ユーザーストーリー
        - 4. 根拠
        - 5. 活用のかたち
        - 6. どう測るか
        - 7. 実現度と足りないデータ
  - type: textarea
    id: note
    attributes:
      label: 気づいたこと
      description: 該当箇所や出典があると助かります。
      placeholder: |
        例: 根拠のオープンデータで○○とあるが、カタログでは△△になっている。
    validations:
      required: true
