        ## N-01 免許を返した日から、通院が遠くなる
        テーマ: 移動・交通

        市内を150mメッシュで区切ると、45.6%のマスが最寄りのバス停まで500m以上ある。75歳以上は15年で2.1倍になった。

        - だれ: 78歳・北部在住・昨年、運転免許を返納した
        - いつ / どこで: 平日の午前、通院の日 / 北部の自宅から、東部・中部の医療機関まで
        - 何に困るか: バス停が遠く、本数も30分に1本。乗り継ぎを含めると片道1時間を超え、帰りの便を気にしながら診察を受けることになる

        ### 根拠に使っているオープンデータ
        - 流山ぐりーんバス GTFSデータ（c_03 道路・交通）
        - 令和7年度高齢者人口・世帯数（c_10 高齢者・介護）
        - 日常生活圏域（c_10 高齢者・介護）
        - 公共施設所在地（全ての施設）（c_18 その他の情報）

        カードの全文: https://nagareyama-issues.pages.dev/issues/bus-blank-area.html

