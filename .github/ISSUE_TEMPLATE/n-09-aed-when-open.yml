        ## N-09 夜10時に使えるAEDは、何台あるのか
        テーマ: 健康・救急

        AED設置場所193件には「使用可能な曜日」「使用不可日」「使用可能な時間帯」まで書かれている。救急出動は年10,894件、うち急病が7,445件。

        - だれ: 夜のジョギング中に、人が倒れる場面に居合わせた人
        - いつ / どこで: 夜間・早朝・休日（＝公共施設が閉まっている時間帯） / 屋外、公共施設の外
        - 何に困るか: AEDの一覧はあるが、その時刻に使えるかどうかを一覧から読み取れない。設置施設が閉まっていれば意味がない

        ### 根拠に使っているオープンデータ
        - AED設置場所（c_18 その他の情報）
        - 流山市救急出動件数（c_17 統計データ）
        - 公共施設所在地（全ての施設）（c_18 その他の情報）
        - 人間ドック、脳ドック助成実施医療機関一覧（c_11 健康増進、医療・検診）

        カードの全文: https://nagareyama-issues.pages.dev/issues/aed-when-open.html

        上の内容を見ながら、気づいたことを下の欄に書いてください。
