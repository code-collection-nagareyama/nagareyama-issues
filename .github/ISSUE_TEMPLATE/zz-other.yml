# Generated by build.py from data/issues.json. Do not edit by hand.
name: "サイト全体・その他"
description: "カードを特定できないとき、サイト全体への気づき"
title: "[その他] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        特定の課題カードに当てはまらないときや、カードをまだ決めていないときに使います。
        カードが分かっている場合は、一覧からそのカードのひな型を選ぶか、サイト（https://nagareyama-issues.pages.dev）のカードページから起票してください。
  - type: dropdown
    id: card
    attributes:
      label: "対象のカード"
      description: "どの課題カードについての気づきか。サイト全体の話なら「特定しない」を選んでください。"
      options:
        - "N-01 免許を返した日から、通院が遠くなる"
        - "N-02 「配達してくれる店」は表にあるのに、地図がない"
        - "N-03 「横断歩道を渡れない子をよく見る」を、地点の情報にする"
        - "N-04 浸水したとき、その避難所まで歩いて行けるのか"
        - "N-05 名簿はある。個別避難計画がない"
        - "N-06 待機児童ゼロのあとに残った、「入りたい園に入れない」"
        - "N-07 「バドミントンができる部屋」を探せない"
        - "N-08 民生費は10年で202億から433億へ。増えた分は何に使われたのか"
        - "N-09 夜10時に使えるAEDは、何台あるのか"
        - "N-10 収集曜日は142地域分ある。それでも「今日は何のごみか」が分からない"
        - "特定しない（サイト全体・その他）"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "気づきの種類"
      options:
        - "事実・データの誤り"
        - "表現・書きぶりの改善"
        - "足りない視点・論点"
        - "活用のアイデア"
        - "その他"
    validations:
      required: true
  - type: dropdown
    id: block
    attributes:
      label: "主にどのブロックか"
      description: "カードの7ブロックのうち、いちばん近いもの。"
      options:
        - "カード全体"
        - "1. だれの、どの場面か"
        - "2. 困っている場面"
        - "3. ユーザーストーリー"
        - "4. 根拠"
        - "5. 活用のかたち"
        - "6. どう測るか"
        - "7. 実現度と足りないデータ"
  - type: textarea
    id: note
    attributes:
      label: "気づいたこと"
      description: "該当箇所や出典があると助かります。"
      placeholder: |
        例: 根拠のオープンデータで○○とあるが、カタログでは△△になっている。
    validations:
      required: true
